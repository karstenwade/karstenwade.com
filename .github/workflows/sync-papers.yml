name: Sync Papers from GitHub Repository

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Trigger on changes to the papers repository (requires webhook setup)
  repository_dispatch:
    types: [papers-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "papers-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch papers from GitHub
        id: fetch_papers
        run: |
          echo "🔍 Fetching papers from GitHub..."
          npm run generate-sitemap

          # Check if sitemap changed
          if git diff --quiet public/sitemap.xml; then
            echo "papers_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No new papers found"
          else
            echo "papers_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Papers updated, sitemap regenerated"
          fi

      - name: Commit sitemap changes
        if: steps.fetch_papers.outputs.papers_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "Update sitemap with latest papers

          Automated sync from karstenwade/papers repository

          🤖 Generated by GitHub Actions"
          git push

      - name: Build site
        if: steps.fetch_papers.outputs.papers_changed == 'true'
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Upload build artifacts for GitHub Pages
        if: steps.fetch_papers.outputs.papers_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.fetch_papers.outputs.papers_changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Vercel deployment
        if: steps.fetch_papers.outputs.papers_changed == 'true'
        run: |
          echo "✅ Sitemap committed and pushed"
          echo "   Vercel will auto-deploy from main branch"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Paper sync failed"
          echo "   Check workflow logs for details"
